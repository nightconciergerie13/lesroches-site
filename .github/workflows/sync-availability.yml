name: Sync Beds24 availability

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-availability
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lire la dispo Beds24 (lecture seule)
        env:
          BEDS24_APIKEY: ${{ secrets.BEDS24_APIKEY }}
          BEDS24_PROPKEYS: ${{ secrets.BEDS24_PROPKEYS }}
        run: node sync-availability.mjs
      # Non bloquant a dessein : si le calcul du prix echoue, la dispo doit
      # quand meme etre publiee. Mieux vaut un prix d appel d hier qu un
      # calendrier d hier.
      - name: Aligner le prix d'appel des pages sur les tarifs Beds24
        continue-on-error: true
        run: node maj-prix-vitrine.mjs
      - name: Publier (si changement)
        run: |
          git config user.name "availability-bot"
          git config user.email "availability-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: maj availability.json et prix d'appel [skip ci]"
            git push
          fi
